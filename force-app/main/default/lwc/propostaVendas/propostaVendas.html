<template>
    <!-- ============================================
         PROPOSTA DE VENDA
         Componente filho - Finalização da venda
    ============================================= -->
    
    <div class="proposta-container">
        
        <!-- HEADER DA PROPOSTA -->
        <div class="proposta-header">
            <lightning-icon icon-name="standard:contract" size="medium"></lightning-icon>
            <div class="header-texto">
                <h2 class="proposta-titulo">Proposta de Venda</h2>
                <p class="proposta-subtitulo">Revise os dados e finalize a negociação</p>
            </div>
        </div>

        <!-- ALERTA SE FALTAR DADOS -->
        <template if:true={faltaDados}>
            <div class="alerta-container">
                <lightning-icon icon-name="utility:warning" size="small" variant="warning"></lightning-icon>
                <div class="alerta-texto">
                    <template if:false={temCliente}>
                        <p>Selecione um cliente na aba "Clientes"</p>
                    </template>
                    <template if:false={temVeiculos}>
                        <p>Adicione veículos ao carrinho na aba "Estoque"</p>
                    </template>
                </div>
            </div>
        </template>

        <!-- CONTEÚDO PRINCIPAL (só mostra se tiver dados) -->
        <template if:false={faltaDados}>
            
            <div class="proposta-grid">
                
                <!-- COLUNA ESQUERDA: Cliente e Veículos -->
                <div class="coluna-dados">
                    
                    <!-- CARD DO CLIENTE -->
                    <div class="secao-card">
                        <div class="secao-header">
                            <lightning-icon icon-name="standard:contact" size="small"></lightning-icon>
                            <h3>Cliente</h3>
                        </div>
                        <div class="cliente-resumo">
                            <p class="cliente-nome-destaque">{clienteSelecionado.Name}</p>
                            <div class="cliente-detalhes">
                                <p>
                                    <lightning-icon icon-name="utility:email" size="xx-small"></lightning-icon>
                                    {clienteEmail}
                                </p>
                                <p>
                                    <lightning-icon icon-name="utility:call" size="xx-small"></lightning-icon>
                                    {clienteTelefone}
                                </p>
                            </div>
                        </div>
                    </div>

                    <!-- LISTA DE VEÍCULOS -->
                    <div class="secao-card">
                        <div class="secao-header">
                            <lightning-icon icon-name="standard:vehicle" size="small"></lightning-icon>
                            <h3>Veículos ({quantidadeVeiculos})</h3>
                        </div>
                        <div class="veiculos-lista">
                            <template for:each={itensCarrinho} for:item="veiculo">
                                <div key={veiculo.Id} class="veiculo-item">
                                    <div class="veiculo-info-resumo">
                                        <span class="veiculo-marca-modelo">{veiculo.marca} {veiculo.modelo}</span>
                                        <span class="veiculo-ano">{veiculo.ano}</span>
                                    </div>
                                    <span class="veiculo-preco-item">R$ {veiculo.precoFormatado}</span>
                                </div>
                            </template>
                        </div>
                    </div>

                </div>

                <!-- COLUNA DIREITA: Condições e Resumo -->
                <div class="coluna-resumo">
                    
                    <!-- CONDIÇÕES DE PAGAMENTO -->
                    <div class="secao-card">
                        <div class="secao-header">
                            <lightning-icon icon-name="utility:moneybag" size="small"></lightning-icon>
                            <h3>Condições de Pagamento</h3>
                        </div>
                        
                        <div class="condicoes-form">
                            <!-- Forma de Pagamento -->
                            <lightning-combobox
                                name="formaPagamento"
                                label="Forma de Pagamento"
                                value={formaPagamento}
                                options={opcoesFormaPagamento}
                                onchange={handleFormaPagamentoChange}>
                            </lightning-combobox>

                            <!-- Desconto -->
                            <div class="desconto-container">
                                <lightning-input
                                    type="number"
                                    label="Desconto (%)"
                                    value={percentualDesconto}
                                    min="0"
                                    max="30"
                                    step="0.5"
                                    onchange={handleDescontoChange}>
                                </lightning-input>
                                <template if:true={temDesconto}>
                                    <span class="desconto-valor">- R$ {valorDescontoFormatado}</span>
                                </template>
                            </div>

                            <!-- Parcelas (só para financiamento) -->
                            <template if:true={mostrarParcelas}>
                                <lightning-combobox
                                    name="parcelas"
                                    label="Número de Parcelas"
                                    value={numeroParcelas}
                                    options={opcoesParcelas}
                                    onchange={handleParcelasChange}>
                                </lightning-combobox>
                                <div class="parcela-info">
                                    <span>{numeroParcelas}x de</span>
                                    <span class="parcela-valor">R$ {valorParcelaFormatado}</span>
                                </div>
                            </template>

                            <!-- Observações -->
                            <lightning-textarea
                                label="Observações"
                                placeholder="Informações adicionais sobre a venda..."
                                value={observacoes}
                                max-length="500"
                                onchange={handleObservacoesChange}>
                            </lightning-textarea>
                        </div>
                    </div>

                    <!-- RESUMO FINANCEIRO -->
                    <div class="secao-card resumo-financeiro">
                        <div class="resumo-linha">
                            <span>Subtotal</span>
                            <span>R$ {subtotalFormatado}</span>
                        </div>
                        <template if:true={temDesconto}>
                            <div class="resumo-linha desconto">
                                <span>Desconto ({percentualDesconto}%)</span>
                                <span>- R$ {valorDescontoFormatado}</span>
                            </div>
                        </template>
                        <div class="resumo-linha total">
                            <span>Total</span>
                            <span>R$ {totalFinalFormatado}</span>
                        </div>
                    </div>

                </div>
            </div>

            <!-- BOTÕES DE AÇÃO -->
            <div class="acoes-container">
                <lightning-button
                    label="Cancelar"
                    variant="neutral"
                    icon-name="utility:close"
                    onclick={handleCancelar}>
                </lightning-button>
                <lightning-button
                    label="Finalizar Venda"
                    variant="brand"
                    icon-name="utility:check"
                    onclick={handleFinalizarVenda}
                    class="btn-finalizar">
                </lightning-button>
            </div>

        </template>

    </div>
</template>
